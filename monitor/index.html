<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoRaWAN Remote Sensor Monitor</title>

<style>
  :root {
    font-family: system-ui, sans-serif;
    color: #172b36;
    background: #f4f7f8;
  }

  body {
    max-width: 1150px;
    margin: 0 auto;
    padding: 28px 18px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  h1 {
    margin: 0;
    font-size: 1.7rem;
  }

  p {
    color: #4e6570;
  }

  .badge {
    border-radius: 99px;
    padding: 5px 10px;
    font-size: .78rem;
    font-weight: 650;
  }

  .online {
    color: #075836;
    background: #dcf6e8;
  }

  .stale {
    color: #87561c;
    background: #fff0d2;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(275px, 1fr));
    gap: 14px;
    margin-top: 24px;
  }

  article,
  .history-panel {
    background: white;
    border: 1px solid #dce6e8;
    padding: 20px;
    border-radius: 13px;
    box-shadow: 0 3px 12px #193b4910;
  }

  article header {
    margin-bottom: 14px;
  }

  article h2 {
    margin: 0;
    font-size: 1.1rem;
  }

  .metrics {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 13px;
  }

  .metrics strong {
    display: block;
    font-size: 1.45rem;
    margin-top: 4px;
  }

  .label,
  small {
    color: #5a6f78;
  }

  small {
    display: block;
    margin-top: 16px;
    overflow-wrap: anywhere;
  }

  button {
    margin-top: 14px;
    padding: 8px 12px;
    border: 1px solid #b8c9cf;
    border-radius: 8px;
    background: white;
    cursor: pointer;
    font-weight: 600;
  }

  button:hover {
    background: #eef4f5;
  }

  .project-links {
    margin: -6px 0 0;
    font-size: .82rem;
  }

  .project-links a {
    color: #176b64;
    text-decoration: none;
    border-bottom: 1px solid #b8c9cf;
  }

  .project-links a:hover {
    border-bottom-color: #176b64;
  }

  #notice {
    margin-top: 20px;
    padding: 24px;
    background: white;
    border-radius: 12px;
  }

  .history-panel {
    margin-top: 28px;
  }

  .chart-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
    gap: 18px;
  }

  .chart-box {
    border: 1px solid #e1e9eb;
    border-radius: 10px;
    padding: 14px;
  }

  .chart-box h3 {
    margin-top: 0;
  }

  svg {
    width: 100%;
    height: 180px;
    background: #fafcfc;
    border-radius: 7px;
  }

  .history-meta {
    color: #5a6f78;
    margin-bottom: 18px;
  }

  @media (max-width: 600px) {
    .chart-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>

<body>

<header>
  <div>
    <h1>LoRaWAN Remote Sensor Monitor</h1>
    <p>ChirpStack v4 · MQTT · SQLite · simulated LoRaWAN validation</p>
    <p class="project-links"><a href="https://github.com/faizankhan107/lorawan-iot-monitor" target="_blank" rel="noreferrer">GitHub repository</a> · <a href="https://faizankhan107.github.io" target="_blank" rel="noreferrer">Portfolio</a></p>
  </div>
  <span id="updated"></span>
</header>

<div id="notice">Waiting for device events...</div>

<main class="grid" id="devices"></main>

<section class="history-panel" id="historyPanel" hidden>
  <h2 id="historyTitle">Device history</h2>
  <div class="history-meta" id="historyMeta"></div>

  <div class="chart-grid">
    <div class="chart-box">
      <h3>Temperature (°C)</h3>
      <svg id="temperatureChart" viewBox="0 0 600 180"></svg>
    </div>

    <div class="chart-box">
      <h3>Humidity (%)</h3>
      <svg id="humidityChart" viewBox="0 0 600 180"></svg>
    </div>

    <div class="chart-box">
      <h3>RSSI (dBm)</h3>
      <svg id="rssiChart" viewBox="0 0 600 180"></svg>
    </div>

    <div class="chart-box">
      <h3>SNR (dB)</h3>
      <svg id="snrChart" viewBox="0 0 600 180"></svg>
    </div>
  </div>
</section>

<script>

const escapeHTML = s =>
  String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[c]));

const display = n =>
  n === null || n === undefined
    ? '—'
    : Number(n).toFixed(1);


function drawChart(svgId, rows, field) {

  const svg = document.getElementById(svgId);

  const values = rows
    .map(r => r[field])
    .filter(v => v !== null && v !== undefined)
    .map(Number);

  if (values.length < 2) {
    svg.innerHTML =
      '<text x="300" y="95" text-anchor="middle" fill="#71858e">' +
      'Not enough history yet' +
      '</text>';
    return;
  }

  let min = Math.min(...values);
  let max = Math.max(...values);

  if (min === max) {
    min -= 1;
    max += 1;
  }

  const width = 600;
  const height = 180;
  const px = 35;
  const py = 20;

  const points = values.map((value, index) => {

    const x =
      px +
      index * ((width - px * 2) / (values.length - 1));

    const y =
      height -
      py -
      ((value - min) / (max - min)) *
      (height - py * 2);

    return `${x},${y}`;

  }).join(' ');

  svg.innerHTML = `
    <line
      x1="${px}"
      y1="${py}"
      x2="${px}"
      y2="${height - py}"
      stroke="#d6e0e3"
    />

    <line
      x1="${px}"
      y1="${height - py}"
      x2="${width - px}"
      y2="${height - py}"
      stroke="#d6e0e3"
    />

    <text x="5" y="${py + 5}" font-size="12" fill="#60747d">
      ${max.toFixed(1)}
    </text>

    <text x="5" y="${height - py}" font-size="12" fill="#60747d">
      ${min.toFixed(1)}
    </text>

    <polyline
      fill="none"
      stroke="#287c9e"
      stroke-width="3"
      stroke-linejoin="round"
      stroke-linecap="round"
      points="${points}"
    />
  `;
}


async function showHistory(devEui, deviceName) {

  try {

    const response =
      await fetch('/api/history/' + encodeURIComponent(devEui));

    if (!response.ok)
      throw new Error('History request failed');

    const rows = await response.json();

    document.getElementById('historyPanel').hidden = false;

    document.getElementById('historyTitle').textContent =
      deviceName + ' history';

    document.getElementById('historyMeta').textContent =
      `${rows.length} stored readings · DevEUI ${devEui}`;

    drawChart('temperatureChart', rows, 'temperature_c');
    drawChart('humidityChart', rows, 'humidity_pct');
    drawChart('rssiChart', rows, 'rssi');
    drawChart('snrChart', rows, 'snr');

    document.getElementById('historyPanel')
      .scrollIntoView({
        behavior: 'smooth',
        block: 'start'
      });

  } catch (error) {

    document.getElementById('historyMeta').textContent =
      'Unable to load history';

  }
}


async function refresh() {

  try {

    const response = await fetch('/api/devices');

    if (!response.ok)
      throw new Error('Server error');

    const devices = await response.json();

    document.getElementById('notice').hidden =
      devices.length > 0;

    document.getElementById('devices').innerHTML =
      devices.map(d => `

        <article>

          <header>
            <h2>${escapeHTML(d.name)}</h2>
            <span class="badge ${d.status}">
              ${escapeHTML(d.status)}
            </span>
          </header>

          <div class="metrics">

            <div>
              <span class="label">Temperature</span>
              <strong>${display(d.temperature_c)} °C</strong>
            </div>

            <div>
              <span class="label">Humidity</span>
              <strong>${display(d.humidity_pct)} %</strong>
            </div>

            <div>
              <span class="label">RSSI</span>
              <strong>${d.rssi === null ? '—' : d.rssi} dBm</strong>
            </div>

            <div>
              <span class="label">SNR</span>
              <strong>${display(d.snr)} dB</strong>
            </div>

          </div>

          <small>
            ${escapeHTML(d.source)}
            · ${escapeHTML(d.dev_eui)}
            <br>
            Last update:
            ${new Date(d.received_at * 1000).toLocaleString()}
          </small>

          <button
            data-eui="${escapeHTML(d.dev_eui)}"
            data-name="${escapeHTML(d.name)}">
            View history
          </button>

        </article>

      `).join('');

    document.querySelectorAll('button[data-eui]').forEach(button => {
      button.addEventListener('click', () => {
        showHistory(
          button.dataset.eui,
          button.dataset.name
        );
      });
    });

    document.getElementById('updated').textContent =
      'Updated ' + new Date().toLocaleTimeString();

  } catch (error) {

    document.getElementById('updated').textContent =
      'Connection unavailable';

  }
}

refresh();
setInterval(refresh, 5000);

</script>

</body>
</html>
